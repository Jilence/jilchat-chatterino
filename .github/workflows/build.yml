---
name: Build

on:
  # Not on a push to main: there the Build is started by hand ("Run workflow").
  # Such a run on main is followed by "Create installer", which makes the
  # installers and a draft release.
  push:
    branches:
      - leafyrino
      - "bugfix-release/**"
      - "release/*"
  pull_request:
  workflow_dispatch:
    inputs:
      buildType:
        description: "Build type"
        required: true
        type: choice
        default: "auto"
        options:
          - auto
          - nightly
          - stable
  merge_group:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  C2_ENABLE_LTO: ${{ github.ref == 'refs/heads/leafyrino' || startsWith(github.ref, 'refs/heads/bugfix-release') || startsWith(github.ref, 'refs/heads/release/')}}
  CHATTERINO_REQUIRE_CLEAN_GIT: On
  CHATTERINO_BUILD_TYPE: ${{ case(inputs.buildType != '', inputs.buildType, 'auto') }}
  CONAN_VERSION: 2.28.1
  C2_APP_EXECUTABLE: Leafyrino
  C2_APP_BUNDLE: Leafyrino.app

jobs:
  build-ubuntu:
    name: "Build Ubuntu ${{ matrix.os }}, Qt ${{ matrix.qt-version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            qt-version: 6.7.2
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-appimage: true
            build-deb: true
            plugins: true
          - os: ubuntu-24.04
            qt-version: 6.9.3
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-appimage: false
            build-deb: true
            plugins: true
          - os: ubuntu-26.04
            qt-version: 6.9.3
            force-lto: false
            skip-artifact: false
            skip-crashpad: false
            build-appimage: false
            build-deb: true
            plugins: true
    env:
      C2_ENABLE_LTO: ${{ matrix.force-lto }}
      C2_ENABLE_CRASHPAD: ${{ matrix.skip-crashpad == false }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          PACKAGES="cmake g++ git pkg-config libboost-dev libnotify-dev libssl-dev libsecret-1-dev hunspell libhunspell-dev file fuse libfuse2 patchelf nasm meson ninja-build curl xz-utils"
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ] || [ "${{ matrix.os }}" = "ubuntu-26.04" ]; then
            PACKAGES="$PACKAGES libboost-json-dev"
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $PACKAGES

      # libvpx, libwebm, libyuv and ffmpeg for the video backgrounds of themes
      - name: Cache video dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/video-dependencies/install
          key: video-dependencies-${{ matrix.os }}-${{ hashFiles('.CI/build-video-dependencies.sh') }}

      - name: Build video dependencies
        run: bash .CI/build-video-dependencies.sh

      - name: Cache Boost (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/cache@v4
        id: boost-cache
        with:
          path: ~/boost-1.83.0
          key: boost-1.83.0-ubuntu-22.04-v1

      - name: Install Boost with JSON (Ubuntu 22.04)
        if: matrix.os == 'ubuntu-22.04' && steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          BOOST_VER=1.83.0
          BOOST_PREFIX="$HOME/boost-${BOOST_VER}"
          BUILD_DIR="$(mktemp -d)"
          cd "$BUILD_DIR"
          wget -q "https://archives.boost.io/release/${BOOST_VER}/source/boost_1_83_0.tar.gz"
          tar xf boost_1_83_0.tar.gz
          cd boost_1_83_0
          ./bootstrap.sh --prefix="${BOOST_PREFIX}"
          ./b2 install --with-json --prefix="${BOOST_PREFIX}" -j"$(nproc)"

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4.3.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-${{ matrix.qt-version }}-v3
          modules: qtimageformats qtcharts qtmultimedia
          version: ${{ matrix.qt-version }}

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "Auto - found release tag format"
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "Auto - did not find release tag format"
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "Override to nightly"
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          elif [ "${CHATTERINO_BUILD_TYPE}" = "stable" ]; then
            echo "Override to stable"
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          else
            echo "Error: no build type variable set"
            exit 1
          fi

      - name: Build
        run: |
          mkdir build
          cd build
          if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
            export CMAKE_PREFIX_PATH="$HOME/boost-1.83.0${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          fi
          export CMAKE_PREFIX_PATH="$CHATTERINO_VIDEO_PREFIX${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          CXXFLAGS=-fno-sized-deallocation cmake \
            -DCMAKE_INSTALL_PREFIX=appdir/usr/ \
            -DCMAKE_BUILD_TYPE=Release \
            -DPAJLADA_SETTINGS_USE_BOOST_FILESYSTEM=On \
            -DUSE_PRECOMPILED_HEADERS=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=On \
            -DCHATTERINO_LTO="$C2_ENABLE_LTO" \
            -DCHATTERINO_NIGHTLY_BUILD=${{ steps.build-type.outputs.NIGHTLY_BUILD }} \
            -DFORCE_JSON_GENERATION=Off \
            -DCHATTERINO_PLUGINS=${{ case(matrix.plugins, 'On', 'Off') }} \
            -DCHATTERINO_THEME_VIDEO=ON \
            -DCHATTERINO_MEDIA_TOOLS_DIR="$CHATTERINO_VIDEO_PREFIX/support/media" \
            ..
          cmake --build . -j"$(nproc)"

      - name: Package - AppImage (Ubuntu)
        if: matrix.build-appimage
        run: |
          cd build
          sh ./../.CI/CreateAppImage.sh

      - name: Upload artifact - AppImage (Ubuntu)
        if: matrix.build-appimage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Leafyrino-x86_64-Qt-${{ matrix.qt-version }}.AppImage
          path: build/Leafyrino-x86_64.AppImage

      - name: Package - .deb (Ubuntu)
        if: matrix.build-deb
        run: |
          cd build
          sh ./../.CI/CreateUbuntuDeb.sh

      - name: Upload artifact - .deb (Ubuntu)
        if: matrix.build-deb
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Chatterino-${{ matrix.os }}.deb
          path: build/Chatterino-${{ matrix.os }}-x86_64.deb

  # MARK: Flatpak
  build-flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # tag access
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          bundle: leafyrino.flatpak
          manifest-path: .CI/com.chatterino.chatterino.yml
          cache-key: flatpak-builder-${{ github.sha }}

      # A .flatpak is a from-empty OSTree static delta. Importing it exercises
      # the same decompression path as an end-user installation and prevents a
      # bundle with an oversized delta part from reaching a release.
      - name: Verify Flatpak bundle is installable
        run: |
          test "$(stat -c %s leafyrino.flatpak)" -lt 536870912
          verify_repo="$(mktemp -d)"
          ostree init --repo="$verify_repo" --mode=archive
          flatpak build-import-bundle "$verify_repo" leafyrino.flatpak
          ostree --repo="$verify_repo" fsck

  # MARK: Main build
  build:
    name: "Build ${{ matrix.os }}, Qt ${{ matrix.qt-version }} (LTO:${{ matrix.force-lto }}, crashpad:${{ case(matrix.skip-crashpad, 'off', 'on') }})"
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            qt-version: 6.9.3
            force-lto: true
            skip-artifact: false
            skip-crashpad: false
          # Windows on ARM
          - os: windows-11-arm
            qt-version: 6.9.3
            force-lto: true
            skip-artifact: false
            skip-crashpad: false
          # macOS (ARM)
          - os: macos-latest
            qt-version: 6.9.3
            macosx-deployment-target: "13.0"
            force-lto: true
            skip-artifact: false
            skip-crashpad: false

      fail-fast: false
    env:
      C2_ENABLE_LTO: ${{ matrix.force-lto }}
      C2_ENABLE_CRASHPAD: ${{ matrix.skip-crashpad == false }}
      C2_ARCH: ${{ case(endsWith(matrix.os, '-arm') || startsWith(matrix.os, 'macos'), 'arm', 'x86-64') }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # allows for tags access
          persist-credentials: false

      - name: Determine build type
        id: build-type
        shell: bash
        run: |
          if [ "${CHATTERINO_BUILD_TYPE}" = "auto" ]; then
            if git describe --exact-match --match 'v*'; then
              echo "Auto - found release tag format"
              echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
            else
              echo "Auto - did not find release tag format"
              echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${CHATTERINO_BUILD_TYPE}" = "nightly" ]; then
            echo "Override to nightly"
            echo "NIGHTLY_BUILD=On" >> "$GITHUB_OUTPUT"
          elif [ "${CHATTERINO_BUILD_TYPE}" = "stable" ]; then
            echo "Override to stable"
            echo "NIGHTLY_BUILD=Off" >> "$GITHUB_OUTPUT"
          else
            echo "Error: no build type variable set"
            exit 1
          fi

      - name: Install Qt6
        if: startsWith(matrix.qt-version, '6.')
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          cache: true
          cache-key-prefix: ${{ runner.os }}-QtCache-${{ matrix.qt-version }}-v3
          modules: qtimageformats qtcharts qtmultimedia
          version: ${{ matrix.qt-version }}

      # MARK: Windows
      - name: Setup sccache (Windows)
        # sccache v0.7.4
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        if: runner.os == 'Windows' || runner.os == 'macOS'
        with:
          variant: ${{ case(runner.os == 'Windows', 'sccache', 'ccache') }}
          # only save on on the default (master) branch
          save: ${{ github.event_name == 'push' }}
          key: sccache-build-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.qt-version }}-${{ matrix.skip-crashpad }}
          restore-keys: |
            sccache-build-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.qt-version }}

      - name: Cache conan packages (Windows/macOS)
        if: runner.os == 'Windows' || runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-conan-user-${{ hashFiles('**/conanfile.py') }}-QT6
          path: ~/.conan2/

      - name: Setup Python (Windows)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: startsWith(matrix.os, 'windows')
        with:
          python-version: "3.13"

      - name: Install and Setup Conan (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          pip install conan==${{env.CONAN_VERSION}}
          conan --version
          conan profile detect -f
        shell: bash

      - name: Install dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          mkdir build
          cd build
          # with_theme_video: libvpx, libwebm, libyuv and the ffmpeg programs
          # for the video backgrounds of themes
          # libwebm only compiles in conformance mode with current MSVC
          # (C2248 in master_value_parser.h otherwise)
          # setup-python sets PKG_CONFIG_PATH to a Windows path. Conan puts its
          # own folder in front of it, and that mix of both path styles isn't
          # understood: ffmpeg's configure doesn't find dav1d then.
          unset PKG_CONFIG_PATH
          # libvpx assembles with yasm, and its build doesn't get the yasm conan
          # provides on its search path; it would only work by the yasm that
          # happens to be on the runner. Put conan's on the path ourselves.
          if [ "${{ runner.arch }}" = "X64" ]; then
            conan install --requires=yasm/1.3.0 \
                --deployer=direct_deploy \
                --deployer-folder=yasm-tool
            PATH="$PWD/yasm-tool/direct_deploy/yasm/bin:$PATH"
            export PATH
          fi
          conan install .. \
              -s build_type=RelWithDebInfo \
              -c tools.cmake.cmaketoolchain:generator="Ninja" \
              -b missing \
              --output-folder=. \
              -o with_openssl3=True \
              -o with_theme_video=True \
              -c "libwebm/*:tools.build:cxxflags=['/permissive-']" || {
            # what ffmpeg's configure tried, if that is what failed; also in
            # the summary of the run, the log of this step gets very long
            for log in ~/.conan2/p/b/ffmpe*/b/*/ffbuild/config.log; do
              if [ -f "$log" ]; then
                tail -n 80 "$log"
                {
                  echo "### ffmpeg configure (${{ matrix.os }})"
                  echo '```'
                  tail -n 80 "$log"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
              fi
            done
            exit 1
          }
          conan cache clean --source --build --download "*"
        shell: bash

      # After the dependencies on purpose: with the Visual Studio environment
      # already active, conan's packages that build with msbuild (libvpx)
      # can't run any program from the search path on the runner. Conan
      # activates Visual Studio for its packages itself.
      - name: Enable Developer Command Prompt (Windows)
        if: startsWith(matrix.os, 'windows')
        uses: Chatterino/msvc-dev-cmd@24444121cb2805a7adbd23d0f4455d0916af896b # v2.0.7
        with:
          arch: ${{env.C2_ARCH == 'arm' && 'arm64' || 'x64' }}

      - name: Install Clang (Windows)
        uses: Nerixyz/install-llvm-action@4af87402e075801cb1ba829dcee5bfafdc733616
        if: startsWith(matrix.os, 'windows')
        with:
          version: 22

      - name: Build (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          cd build
          # GitHub windows runners ship Chocolatey `ccache`, which CMake picks up as
          # CMAKE_RC_COMPILER_LAUNCHER. That wraps `cmake -E cmake_llvm_rc` and breaks
          # windows.rc via ccache @response files. Upstream uses llvm-rc + sccache for
          # CXX only; strip ccache and clear launcher env so RC stays unwrapped.
          $env:Path = (
            $env:Path -split ';' |
            Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'ccache.exe')) }
          ) -join ';'
          Remove-Item Env:CMAKE_RC_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_CXX_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          Remove-Item Env:CMAKE_C_COMPILER_LAUNCHER -ErrorAction SilentlyContinue
          cmake `
              -G Ninja `
              -DCMAKE_CXX_COMPILER=clang-cl `
              -DCMAKE_C_COMPILER=clang-cl `
              -DCMAKE_RC_COMPILER=llvm-rc `
              -DCMAKE_LINKER_TYPE=LLD `
              -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" `
              -DUSE_PRECOMPILED_HEADERS=ON `
              -DBUILD_WITH_CRASHPAD="$Env:C2_ENABLE_CRASHPAD" `
              -DCHATTERINO_LTO="$Env:C2_ENABLE_LTO" `
              -DCHATTERINO_FORCE_LTO="$Env:C2_ENABLE_LTO" `
              -DFORCE_JSON_GENERATION=${{ env.C2_ARCH == 'arm' && 'Off' || 'On' }} `
              -DSKIP_JSON_GENERATION=${{ env.C2_ARCH == 'arm' && 'On' || 'Off' }} `
              -DCHATTERINO_NIGHTLY_BUILD="${{ steps.build-type.outputs.NIGHTLY_BUILD }}" `
              -DFORCE_JSON_GENERATION=Off `
              -DCHATTERINO_SPELLCHECK=On `
              -DCHATTERINO_THEME_VIDEO=ON `
              ..
          ninja

      - name: Build crashpad (Windows)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-crashpad
        shell: pwsh
        run: |
          cd build
          ninja chatterino-crash-handler
          mkdir Chatterino2/crashpad
          cp bin/crashpad/crashpad-handler.exe Chatterino2/crashpad/crashpad-handler.exe
          7z a bin/leafyrino-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.pdb.7z bin/${{ env.C2_APP_EXECUTABLE }}.pdb

      - name: Prepare build dir (windows)
        if: startsWith(matrix.os, 'windows')
        working-directory: build
        run: |
          windeployqt bin/${{ env.C2_APP_EXECUTABLE }}.exe --release --no-compiler-runtime --no-translations --no-opengl-sw --dir Chatterino2/ --force-openssl
          cp bin/${{ env.C2_APP_EXECUTABLE }}.exe Chatterino2/
          ..\.CI\deploy-crt.ps1 Chatterino2

      - name: Package (windows)
        if: startsWith(matrix.os, 'windows')
        working-directory: build
        run: |
          7z a chatterino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.zip Chatterino2/

      - name: Upload artifact (Windows - binary)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatterino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.zip
          path: build/chatterino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.zip

      - name: Upload artifact (Windows - symbols)
        if: startsWith(matrix.os, 'windows') && !matrix.skip-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leafyrino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}-symbols.pdb.7z
          path: build/bin/leafyrino-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.pdb.7z

      # MARK: macOS
      - name: Install dependencies (MacOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          # binary dependencies
          brew install rapidjson p7zip create-dmg tree conan ninja
        shell: bash

      # libvpx, libwebm, libyuv and ffmpeg for the video backgrounds of themes,
      # for both architectures
      - name: Cache video dependencies (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/video-dependencies/install
          key: video-dependencies-${{ matrix.os }}-${{ matrix.macosx-deployment-target }}-${{ hashFiles('.CI/build-video-dependencies.sh') }}

      - name: Build video dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install meson nasm pkg-config
          bash .CI/build-video-dependencies.sh
        shell: bash

      - name: Setup Conan (macOS)
        if: runner.os == 'macOS'
        run: |
          conan --version
          conan profile detect -f
        shell: bash

      - name: Install conan dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir build && cd build
          conan install .. \
              -s build_type=Release \
              -c tools.cmake.cmaketoolchain:generator=Ninja \
              -s "arch=armv8|x86_64" \
              -b missing \
              --output-folder=. \
              -o with_openssl3=True
          conan cache clean --source --build --download "*"
        shell: bash

      - name: Build (MacOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p build
          cd build
          cmake \
              -DCMAKE_TOOLCHAIN_FILE="conan_toolchain.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DUSE_PRECOMPILED_HEADERS=OFF \
              -DCHATTERINO_LTO="$C2_ENABLE_LTO" \
              -DCHATTERINO_NO_AVIF_PLUGIN=On \
              -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
              -DFORCE_JSON_GENERATION=Off \
              -DCHATTERINO_NIGHTLY_BUILD=${{ steps.build-type.outputs.NIGHTLY_BUILD }} \
              -DCHATTERINO_SPELLCHECK=On \
              -DCMAKE_PREFIX_PATH="$CHATTERINO_VIDEO_PREFIX" \
              -DCHATTERINO_THEME_VIDEO=ON \
              -DCHATTERINO_MEDIA_TOOLS_DIR="$CHATTERINO_VIDEO_PREFIX/support/media" \
              -G Ninja \
              ..
          ninja
        shell: bash

      - name: Package (MacOS)
        if: runner.os == 'macOS'
        env:
          OUTPUT_DMG_PATH: chatterino-macos-Qt-${{ matrix.qt-version}}-universal.dmg
        run: |
          set -ex
          ls -la
          pwd
          ls -la build || true
          cd build
          export MACOS_CODESIGN_CERTIFICATE="-"
          echo "-> $MACOS_CODESIGN_CERTIFICATE"

          echo "Downloading kimageformats plugins"
          curl -SsfLo kimg.zip "https://github.com/nerixyz/kimageformats-binaries/releases/download/cont/kimageformats-macos-14-${{ matrix.qt-version}}.zip"

          ./../.CI/MacDeploy.sh

          ls -la "${{ env.C2_APP_BUNDLE }}/Contents/Frameworks"

          # Fix the library IDs to match their new location
          # install_name_tool -id @executable_path/../Frameworks/libssl.3.dylib "${{ env.C2_APP_BUNDLE }}/Contents/Frameworks/libssl.3.dylib"
          # install_name_tool -id @executable_path/../Frameworks/libcrypto.3.dylib "${{ env.C2_APP_BUNDLE }}/Contents/Frameworks/libcrypto.3.dylib"

          otool -L "${{ env.C2_APP_BUNDLE }}/Contents/Frameworks/libssl.3.dylib"
          # Fix the search path for libcrypto in libssl

          ./../.CI/CreateDMG.sh
        shell: bash

      - name: Upload artifact (MacOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatterino-macos-Qt-${{ matrix.qt-version }}-universal.dmg
          path: build/chatterino-macos-Qt-${{ matrix.qt-version }}-universal.dmg

  # MARK: Create release
  create-release:
    needs: [build-ubuntu, build-flatpak, build]
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/leafyrino')
    permissions:
      contents: write # create release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: true # Required to update the nightly-build tag.

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        name: Download artifacts
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Rename artifacts
        run: |
          ls -l
          # Rename the macos build to indicate that it's for macOS 13.0 users
          mv chatterino-macos-Qt-6.9.3-universal.dmg Chatterino-macOS-13.0-universal.dmg
          # Rename Windows ARM64 to indicate that it's not well tested
          mv chatterino-windows-arm-Qt-6.9.3.zip Experimental-ARM64-chatterino-windows-Qt-6.9.3.zip
        working-directory: release-artifacts
        shell: bash

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Format changes
        id: format-changes
        run: |
          delimiter=$(openssl rand -hex 32)
          {
            echo "changelog<<$delimiter"
            python3 ./.CI/format-recent-changes.py --artifacts release-artifacts --include-installer
            echo $delimiter
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          body: ${{ steps.format-changes.outputs.changelog }}
          prerelease: true
          name: Nightly Release
          tag: nightly-build

      - name: Update nightly-build tag
        run: |
          git tag -f nightly-build
          git push -f origin nightly-build
        shell: bash

  # MARK: Collect
  collect:
    needs: [build, build-ubuntu, build-flatpak]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
      - name: Done
        run: exit 0
