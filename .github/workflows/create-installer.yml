name: Create installer

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

env:
  C2_PORTABLE_INSTALLER_VERSION: "v0.1.4"
  C2_PORTABLE_INSTALLER_SHA256_X64: "77bcbe8c0fb0e2e7c40c89a250816b3def14cb5d0144b98293d3224fe2b1a59b"
  C2_PORTABLE_INSTALLER_SHA256_ARM64: "525491265bc879bb5e80a87bda39c850f91fb96b691a1aa72d34553ead7d7cd2"
  RELEASE_NIGHTLY_INSTALLER: "OFF"
permissions:
  contents: read
  actions: read

jobs:
  create-installer:
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        qt-version: ["6.9.3"]
        os: [windows-latest, windows-11-arm]
    env:
      # same as in build.yml
      C2_ARCH: ${{ case(endsWith(matrix.os, '-arm'), 'arm', 'x86-64') }}
    permissions:
      # FIXME: this only needed for the nightly upload step (should split to another job)
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # allows for tags access
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: true # release action

      - name: Resolve Build workflow run
        id: resolve-build-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            if (context.eventName === "workflow_run") {
              return String(context.payload.workflow_run.id);
            }

            const { owner, repo } = context.repo;

            // Manual runs do not have a triggering workflow_run payload.
            // Match the previous commit-based artifact lookup behavior.
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 1,
            });

            const run = response.data.workflow_runs[0];

            if (!run) {
              core.setFailed(`No successful Build workflow run found for commit ${context.sha}.`);
              return "";
            }

            return String(run.id);

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chatterino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.zip
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-build-run.outputs.result }}
          path: build/

      - name: Unzip
        run: 7z e -spf chatterino-windows-${{ env.C2_ARCH }}-Qt-${{ matrix.qt-version }}.zip
        working-directory: build

      - name: Install InnoSetup
        run: choco install innosetup

      - name: Add InnoSetup to path
        run: echo "C:\Program Files (x86)\Inno Setup 6\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@24444121cb2805a7adbd23d0f4455d0916af896b # v2.0.7

      - name: Build installer
        id: build-installer
        working-directory: build
        run: ..\.CI\build-installer.ps1
        shell: powershell

      - name: Bundle portable
        id: bundle-portable
        working-directory: build
        run: ..\.CI\bundle-portable.ps1
        shell: powershell

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ steps.build-installer.outputs.C2_INSTALLER_BASE_NAME }}.exe
          name: ${{ steps.build-installer.outputs.C2_INSTALLER_BASE_NAME }}.exe

      - name: Upload portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ steps.bundle-portable.outputs.C2_PORTABLE_BASE_NAME }}.zip
          name: ${{ steps.bundle-portable.outputs.C2_PORTABLE_BASE_NAME }}.zip

      - name: Create nightly release
        if: ${{ contains(steps.build-installer.outputs.C2_INSTALLER_BASE_NAME, 'Nightly') && env.RELEASE_NIGHTLY_INSTALLER == 'ON' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          replacesArtifacts: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          artifactErrorsFailBuild: true
          artifacts: |
            build/${{ steps.build-installer.outputs.C2_INSTALLER_BASE_NAME }}.exe
            build/${{ steps.bundle-portable.outputs.C2_PORTABLE_BASE_NAME }}.zip
          prerelease: true
          name: Nightly Release
          tag: nightly-build

  draft-release:
    runs-on: ubuntu-latest
    needs: create-installer
    permissions:
      contents: write
      actions: read

    steps:
      - name: Resolve Build workflow run
        id: build-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          result-encoding: string
          script: |
            if (context.eventName === "workflow_run") {
              return String(context.payload.workflow_run.id);
            }

            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 1,
            });

            const run = response.data.workflow_runs[0];
            if (!run) {
              throw new Error(`No successful Build found for ${context.sha}`);
            }

            return String(run.id);

      - name: Download all Build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build-run.outputs.result }}
          path: artifacts/build

      - name: Download all installer artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts/installer

      - name: Collect release files and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files

          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if [ -e "release-files/$name" ]; then
              echo "Duplicate release filename: $name"
              exit 1
            fi
            cp "$file" "release-files/$name"
          done < <(find artifacts -type f -print0)

          cd release-files
          shopt -s nullglob
          files=(*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          sha256sum -- "${files[@]}" > sha256-checksums.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          BUILD_RUN_ID: ${{ steps.build-run.outputs.result }}
        run: |
          set -euo pipefail
          tag="build-${BUILD_RUN_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$tag" release-files/* \
            --draft \
            --target "$RELEASE_SHA" \
            --title "JilChat Chatterino – Build ${BUILD_RUN_ID}" \
            --generate-notes